name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Clear a known stuck pages_build_version that blocks new deploys.
          for sha in e64aaa22aa2475a573b10ef65add6a84e92b2abb; do
            echo "Cancelling pages deployment $sha (if present)..."
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/${sha}/cancel" || true
          done

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp -a index.html logos.html styles.css script.js i18n.js CNAME .nojekyll README.md favicon.ico _site/
          cp -a assets _site/assets

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
