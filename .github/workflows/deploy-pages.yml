name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Clear stuck pages_build_versions that block new deploys.
          for sha in \
            e64aaa22aa2475a573b10ef65add6a84e92b2abb \
            946c7fbf3b1cb743e0388df774177bd53b4b88f6 \
            aaccc3efbcb756f36ec9872c0f5f02d1abdb797c \
            350a318313469337a7ea6eab42cf922387671a62 \
            cdac491de0b844fd83d7798b0f5aca7f8559ea1b \
            0260795ef15488c548509519c8b40caee3c69320 \
            b1064957d67357b4cda98e03dbf6d1d8ff072f0d \
            5399adfdac5b184d99f0a242801e814ca566b999
          do
            echo "Cancelling pages deployment $sha (if present)..."
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/${sha}/cancel" || true
          done
          sleep 5
      - name: Prepare site files
        run: |
          mkdir -p _site
          cp -a index.html logos.html styles.css script.js i18n.js CNAME .nojekyll README.md favicon.ico _site/
          cp -a assets _site/assets

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
